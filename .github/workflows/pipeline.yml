name: Pipeline

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/pipeline.yml"
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t job-sniper-bot:ci .

  deploy:
    name: Deploy
    needs: [test, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - name: Deploy to Dokploy and wait for the result
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          base="${DOKPLOY_URL%/}/api"

          api() {
            curl --fail-with-body -sS -H "x-api-key: ${DOKPLOY_API_KEY}" "$@"
          }

          latest() {
            local response
            response=$(api --retry 3 --retry-delay 2 "${base}/deployment.all?applicationId=${APPLICATION_ID}") || {
              echo "::error::Could not read deployments from Dokploy: ${response}" >&2
              return 1
            }
            jq -c 'sort_by(.createdAt) | last // {}' <<< "$response"
          }

          before=$(latest | jq -r '.deploymentId // empty')

          api -X POST "${base}/application.deploy" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${APPLICATION_ID}\", \"title\": \"Deploy ${GITHUB_SHA}\"}"
          echo
          echo "Deployment requested for ${GITHUB_SHA}"

          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 10
            current=$(latest)
            id=$(jq -r '.deploymentId // empty' <<< "$current")
            status=$(jq -r '.status // empty' <<< "$current")
            if [ -n "$id" ] && [ "$id" != "$before" ]; then
              echo "Deployment ${id}: ${status}"
              case "$status" in
                done) exit 0 ;;
                error | cancelled)
                  echo "::error::Dokploy deployment ${id} ended with status '${status}'. Check the deployment logs in Dokploy."
                  exit 1
                  ;;
              esac
            fi
          done

          echo "::error::Timed out waiting for the Dokploy deployment to finish."
          exit 1